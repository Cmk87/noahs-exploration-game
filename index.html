<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1030">
<meta name="apple-mobile-web-app-title" content="Noah">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>SUPER LETRAS</title>
<style>
  :root{--night:#0B1030;--bolt:#FFD400;--blaze:#FF3B30;--beam:#00D4FF;--ink:#05060F}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none;overflow:hidden}
  body{
    background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,212,0,.07) 0deg 7deg,transparent 7deg 14deg),
      radial-gradient(circle at 50% 40%,#21306E 0%,#131C46 45%,#0B1030 100%);
    background-attachment:fixed;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);user-select:none;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:9px 9px}
  .display{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;letter-spacing:1.5px;text-transform:uppercase}

  header{width:100%;max-width:540px;position:relative;z-index:2;display:flex;align-items:center;
    justify-content:space-between;gap:8px;padding:9px 14px 2px}
  .power{font-size:19px;font-weight:bold;color:var(--ink);background:var(--bolt);
    border:3px solid var(--ink);border-radius:6px;padding:4px 12px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
  .lang{flex:0 0 auto;display:flex;background:#fff;border:3px solid var(--ink);border-radius:6px;overflow:hidden;
    box-shadow:4px 4px 0 var(--ink);transform:rotate(2deg)}
  .lang button{border:0;background:transparent;font-size:21px;line-height:1;padding:5px 9px;cursor:pointer;
    filter:saturate(.3) opacity(.5)}
  .lang button.on{background:var(--blaze);filter:none}

  .tabs{position:relative;z-index:2;display:flex;gap:7px;width:100%;max-width:540px;padding:7px 14px 3px;
    overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 1 0;min-width:0;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);
    font-size:min(6.4vw,27px);line-height:1;padding:7px 0;text-align:center;
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--bolt);transform:translateY(-3px) scale(1.12);z-index:1}
  .tab:active{transform:translate(3px,3px);box-shadow:none}

  body{position:fixed;inset:0;width:100%;height:auto}
  header,.tabs{flex:0 0 auto}
  /* each tab scrolls inside itself, so the header and tabs can never be pushed off screen */
  .view{display:none;position:relative;z-index:2;width:100%;max-width:540px;flex:1 1 auto;min-height:0;
    flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .view.on>*{flex-shrink:0}
  .view.on{display:flex}

  /* ---------- tracing ---------- */
  .segs{display:flex;gap:7px;padding:8px 14px 2px}
  .seg{border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);font-weight:bold;
    font-size:15px;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:inherit}
  .seg.on{background:var(--beam)}
  #stage{width:100%;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(94vw,470px,calc(100dvh - 330px));min-width:240px;aspect-ratio:1/1}
  #c{touch-action:none;position:absolute;inset:0;width:100%;height:100%;background:#F4F7FF;border:5px solid var(--ink);
    border-radius:8px;box-shadow:8px 8px 0 var(--ink);display:block}
  #wrap.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-1deg)}75%{transform:translateX(9px) rotate(1deg)}}
  .letterbar{display:flex;gap:8px;padding:10px 14px 6px;width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .letterbar::-webkit-scrollbar{display:none}
  .letterbar button{flex:0 0 auto;width:46px;height:46px;border-radius:6px;border:3px solid var(--ink);
    background:#fff;font-size:23px;font-weight:bold;font-family:inherit;color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;line-height:1}
  .letterbar button.on{background:var(--bolt);transform:scale(1.1) rotate(-3deg)}
  .tools{display:flex;gap:11px;padding:2px 0 14px;flex-wrap:wrap;justify-content:center}
  .tools button{border:3px solid var(--ink);border-radius:6px;background:#fff;font:inherit;font-weight:bold;
    font-size:19px;padding:9px 20px;color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
  .tools button:active{transform:translate(4px,4px);box-shadow:none}
  #sayBtn{background:var(--beam)}
  #nextBtn{background:var(--blaze);color:#fff}

  #praise{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #praiseCol{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:4%}
  #burst{position:relative;width:70%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;background:var(--bolt);
    clip-path:polygon(50% 0%,60% 17%,77% 8%,73% 27%,93% 25%,82% 41%,100% 50%,82% 59%,93% 75%,73% 73%,77% 92%,
      60% 83%,50% 100%,40% 83%,23% 92%,27% 73%,7% 75%,18% 59%,0% 50%,18% 41%,7% 25%,27% 27%,23% 8%,40% 17%);
    animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
  #face{font-size:min(23vw,116px);line-height:1;text-align:center;word-break:break-all;
    animation:hover .5s ease-in-out infinite alternate}
  #face.small{font-size:min(13vw,58px)}
  #wordText{margin-top:15px;font-size:min(7.5vw,38px);color:var(--ink);background:var(--beam);
    border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:5px 18px 9px;transform:rotate(-2deg)}
  @keyframes hover{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg)}}
  @keyframes slam{0%{transform:scale(.15) rotate(-25deg);opacity:0}65%{transform:scale(1.12) rotate(6deg);opacity:1}
    100%{transform:scale(1) rotate(-3deg)}}

  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
    background:rgba(11,16,48,.97);cursor:pointer;text-align:center}
  .gateBolt{font-size:min(26vw,130px);line-height:1;filter:drop-shadow(0 0 22px rgba(255,212,0,.85));
    animation:hover .6s ease-in-out infinite alternate}
  .gateText{color:var(--bolt);font-size:min(8vw,38px);margin-top:6px;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
  .gateSub{color:#fff;font-size:min(4vw,17px);margin-top:10px;opacity:.85}

  #voiceWarn{position:relative;z-index:2;display:none;max-width:500px;margin:0 14px 10px;background:var(--blaze);
    color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 12px;font-size:14px;
    font-weight:bold;border-radius:6px}

  /* ---------- quiz + listening ---------- */
  #quizHead{display:flex;justify-content:center;width:100%;margin-top:8px;gap:8px}
  #levelPill{background:var(--blaze);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    padding:3px 12px 5px;font-size:15px}
  #levelPill.pop{animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
  .prompt{background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);color:var(--ink);
    font-size:min(6vw,27px,3.4dvh);padding:9px 16px 12px;margin:10px 14px 14px;text-align:center;transform:rotate(-1deg)}
  #grid,#earGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;padding:0 14px;max-width:min(100%,calc((100dvh - 270px)*1.5))}
  #earGrid{max-width:min(100%,calc((100dvh - 200px)*1.5))}
  .card{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#F4F7FF;
    border:4px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);font-size:min(12vw,60px);cursor:pointer}
  .card:active{transform:translate(5px,5px);box-shadow:none}
  .card.wrong{animation:shake .4s;background:#FFD7D4;border-color:var(--blaze)}
  .card.right{background:var(--bolt);animation:slam .45s cubic-bezier(.2,1.7,.4,1)}
  .card.hint{box-shadow:0 0 0 5px var(--beam),5px 5px 0 var(--ink)}
  #quizWin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(11,16,48,.92);z-index:9;pointer-events:none;text-align:center;flex-direction:column}
  #quizWin.on{display:flex}
  #quizFace{font-size:min(38vw,190px);line-height:1;animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
  #quizWord{margin-top:16px;font-size:min(8vw,40px);color:var(--ink);background:var(--bolt);border:4px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);padding:5px 20px 9px;transform:rotate(-2deg)}

  #earHead{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;margin:10px 0 14px}
  #earHead button{border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:26px;padding:8px 16px;
    box-shadow:4px 4px 0 var(--ink);cursor:pointer;line-height:1}
  #earAgain{background:var(--beam)!important;font-size:32px!important;padding:10px 24px!important}
  #earAgain.playing{animation:pulse .6s ease-in-out infinite alternate}
  #earHead button:active{transform:translate(4px,4px);box-shadow:none}
  #earLevelPill{background:var(--blaze);color:#fff;border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);padding:3px 12px 5px;font-size:15px}
  #earSpeaker{
    font-size:min(26vw,120px);line-height:1;margin:8px 0 2px;background:var(--beam);
    border:5px solid var(--ink);border-radius:50%;box-shadow:6px 6px 0 var(--ink);
    width:min(34vw,150px,15dvh);height:min(34vw,150px,15dvh);font-size:min(26vw,120px,11dvh);cursor:pointer;padding:0;
  }
  #earSpeaker:active{transform:translate(6px,6px);box-shadow:none}
  #earSpeaker.playing{animation:pulse .6s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}

  /* ---------- space ---------- */
  #spaceWrap{position:relative;width:100%;padding:0 14px}
  #sky{width:100%;aspect-ratio:1/1;touch-action:none;background:#05081E;border:5px solid var(--ink);border-radius:8px;
    box-shadow:8px 8px 0 var(--ink);display:block}
  #factBox{margin:12px 14px 0;background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    color:var(--ink);padding:10px 14px 13px;text-align:center;min-height:64px}
  #factName{font-family:Impact,sans-serif;font-size:min(7vw,32px);letter-spacing:1px}
  #factText{font-size:min(4.4vw,18px);margin-top:4px}

  /* ---------- parent ---------- */
  #parent{padding:14px;width:100%;color:#fff}
  .panel{background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    padding:12px 14px;margin-bottom:14px;border-radius:6px}
  .panel h3{margin:0 0 8px;font-family:Impact,sans-serif;letter-spacing:1px;font-size:19px}
  .row{display:flex;justify-content:space-between;padding:3px 0;font-size:15px;border-bottom:1px dotted #bbb}
  .row:last-child{border:0}
  #voiceSel{width:100%;font-size:16px;padding:8px;border:3px solid var(--ink);border-radius:6px;font-family:inherit;background:#fff;color:var(--ink)}
  #nameInput{width:100%;font-size:20px;padding:9px;border:3px solid var(--ink);border-radius:6px;
    font-family:inherit;text-align:center;letter-spacing:2px}
  .btn{border:3px solid var(--ink);border-radius:6px;background:var(--bolt);font:inherit;font-weight:bold;
    font-size:16px;padding:9px 16px;color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;margin-top:10px}
  .chips{display:flex;gap:7px;width:100%;padding:6px 14px 2px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);
    font:inherit;font-weight:bold;font-size:13px;padding:6px 11px;box-shadow:2px 2px 0 var(--ink);
    cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--bolt);transform:translateY(-1px)}
  .chip:active{transform:translate(2px,2px);box-shadow:none}
  #actHead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 14px 0 0}
  #actLevel{background:var(--blaze);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:3px 12px 5px;font-size:15px}
  #actLevel.pop,#levelPill.pop,#earLevelPill.pop{animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
  #actLevel.down,#levelPill.down,#earLevelPill.down{animation:shake .4s}
  .apane{display:none;flex-direction:column;align-items:center;width:100%}
  .apane.on{display:flex}
  #actPrompt{font-size:min(5.6vw,25px)}
  #actGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:460px;padding:0 14px}
  #actGrid.countMode{grid-template-columns:1fr}
  .numRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .numBtn{flex:1 1 0;max-width:72px;border:4px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:bold 30px Impact,sans-serif;
    padding:6px 0 4px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1;
    animation:cardIn .4s cubic-bezier(.2,1.6,.4,1) both;transition:opacity .3s}
  .numBtn small{font-size:8px;letter-spacing:1px;color:var(--blaze);margin-top:3px}
  .numBtn.right{background:var(--bolt);transform:scale(1.15)}
  .numBtn.wrong{animation:shake .4s;border-color:var(--blaze)}
  .numBtn.dim{opacity:.3}
  .numBtn.hint{box-shadow:0 0 0 5px var(--beam),4px 4px 0 var(--ink)}
  #actGrid.three .acard:last-child{grid-column:1 / span 2;justify-self:center;width:calc(50% - 6px)}
  .acard{aspect-ratio:1/1;background:#F4F7FF;border:4px solid var(--ink);border-radius:10px;
    box-shadow:5px 5px 0 var(--ink);cursor:pointer;overflow:hidden;position:relative;transition:opacity .3s,transform .3s;
    display:flex;align-items:center;justify-content:center;animation:cardIn .45s cubic-bezier(.2,1.6,.4,1) both}
  .acard canvas{width:100%;height:100%;display:block}
  .acard:active{transform:translate(5px,5px);box-shadow:none}
  .acard.wrong{animation:shake .4s;border-color:var(--blaze)}
  .acard.right{border-color:var(--bolt);box-shadow:0 0 0 5px var(--bolt),0 0 26px 8px rgba(255,212,0,.8);transform:scale(1.05);z-index:2}
  .acard.dim{opacity:.25;transform:scale(.92)}
  .acard.hint{box-shadow:0 0 0 5px var(--beam),5px 5px 0 var(--ink);animation:pulse .5s ease-in-out infinite alternate}
  @keyframes cardIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .card{animation:cardIn .4s cubic-bezier(.2,1.6,.4,1) both}
  .art{display:inline-block;padding:0 .28em;border-radius:.3em;color:#fff;-webkit-text-stroke:0;text-shadow:none;
    border:2px solid var(--ink);line-height:1.15}
  .art.g-m,.artBtn.g-m{background:#2F6BFF}.art.g-f,.artBtn.g-f{background:#FF3B30}
  .art.g-n,.artBtn.g-n{background:#13B85E}.art.g-pl{background:#FF8A00}
  #actSentence .art,#playSentence .art{font-size:.95em;color:#fff}
  .artPic{grid-column:1 / span 3;aspect-ratio:auto!important;height:min(34vw,22dvh,170px);font-size:min(26vw,17dvh,130px)!important}
  .artBtn{color:#fff!important;font:bold min(9vw,40px) Impact,"Arial Black",sans-serif!important;aspect-ratio:auto!important;padding:18px 0;
    text-shadow:2px 2px 0 var(--ink)}
  .plCard{flex-wrap:wrap;align-content:center;gap:0 2px;line-height:1.05;padding:4px;text-align:center}
  .plCard.pl1{font-size:min(14vw,62px)!important}.plCard.pl2{font-size:min(10vw,46px)!important}
  .plCard.pl3,.plCard.pl4{font-size:min(8vw,36px)!important}
  #quizWord b{color:var(--blaze)}
  #grid.nine .card{font-size:min(10vw,48px)}
  #actSentence,#playSentence{min-height:46px;margin:12px 14px 0;font-size:min(6vw,26px);text-align:center;font-weight:bold;color:#fff;
    text-shadow:2px 2px 0 var(--ink)}
  #actSentence:not(:empty){animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
  #actSentence b,#playSentence b{color:var(--bolt);font-size:1.12em}
  #tprBox{display:none;flex-direction:column;align-items:center;width:100%;padding:0 14px}
  #tprBox.on{display:flex}
  #tprStage{width:min(80vw,340px)}
  #tprStage .acard{width:100%}
  #tprDone{font-size:34px;padding:12px 46px;background:var(--kiwi,#2ED17A)}
  #playCv{width:min(calc(100% - 28px),calc(100dvh - 430px),420px);min-width:200px;aspect-ratio:1/1;border:5px solid var(--ink);
    border-radius:10px;box-shadow:8px 8px 0 var(--ink);display:block;margin-top:8px;cursor:pointer}
  #playAdj,#playVerbs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%;max-width:470px;padding:10px 14px 0}
  .pchip,.pverb{border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:24px;line-height:1;padding:6px 7px;
    box-shadow:3px 3px 0 var(--ink);cursor:pointer}
  .pchip{border-radius:999px;font-size:20px;padding:5px 7px}
  .pchip.on,.pverb.on{background:var(--bolt);transform:translateY(-3px) rotate(-4deg)}
  .pchip:active,.pverb:active{transform:translate(3px,3px);box-shadow:none}
  #map{width:calc(100% - 28px);max-width:520px;aspect-ratio:1.6/1;background:#123A63;border:5px solid var(--ink);
    border-radius:8px;box-shadow:6px 6px 0 var(--ink);display:block;margin:8px auto 0;touch-action:none}
  #geoBox{margin:12px auto 0;width:calc(100% - 28px);background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    color:var(--ink);padding:10px 14px 13px;text-align:center;min-height:64px;max-width:520px}
  #geoName{font-family:Impact,sans-serif;font-size:min(7vw,32px);letter-spacing:1px}
  #geoText{font-size:min(4.4vw,18px);margin-top:4px}
  /* ---------- prizes ---------- */
  .pane{display:none;flex-direction:column;align-items:center;width:100%}
  .pane.on{display:flex}
  #digLock{padding:12px 14px;text-align:center}
  #lockIcon{font-size:min(24vw,110px);line-height:1;animation:hover .7s ease-in-out infinite alternate;
    filter:drop-shadow(0 0 18px rgba(255,212,0,.6))}
  #lockText{font-size:min(6.5vw,28px);margin:6px 0 10px;color:var(--bolt);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
  #meterOuter{width:min(88%,380px);height:26px;background:rgba(255,255,255,.14);
    border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
  #meterFill{height:100%;width:0%;background:repeating-linear-gradient(-45deg,#FFD400 0 12px,#FFE45C 12px 24px);
    transition:width .5s cubic-bezier(.2,1.4,.4,1);border-right:3px solid var(--ink);animation:stripes 1s linear infinite;background-size:34px 34px}
  @keyframes stripes{to{background-position:34px 0}}
  #meterLabel{font-weight:bold;margin-top:6px;font-size:15px;opacity:.9}
  #gameGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:460px;margin-top:14px}
  .gcard{position:relative;border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
    padding:10px 6px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  .gcard .gi{font-size:min(16vw,72px);line-height:1.1}
  .gcard .gl{font-family:Impact,Haettenschweiler,sans-serif;font-size:min(5.6vw,23px);letter-spacing:1px;color:#fff;
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
  .gcard .gc{position:absolute;top:6px;right:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;
    font-size:12px;font-weight:bold;padding:1px 6px}
  .gcard:not(.locked) .gi{animation:hover .8s ease-in-out infinite alternate}
  .gcard:not(.locked)::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,
    rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 2.8s ease-in-out infinite;pointer-events:none}

function samplePoints(segs){
  const pts=[];
  for(const s of segs){
    for(let i=0;i<=60;i++){
      const t=i/60;
      if(s.t==='l') pts.push([s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t]);
      else{const u=1-t;pts.push([
        u*u*u*s.a[0]+3*u*u*t*s.c1[0]+3*u*t*t*s.c2[0]+t*t*t*s.b[0],
        u*u*u*s.a[1]+3*u*u*t*s.c1[1]+3*u*t*t*s.c2[1]+t*t*t*s.b[1]]);}
    }
  }
  return resample(pts,34);
}
function resample(pts,n){
  const d=[0];
  for(let i=1;i<pts.length;i++) d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=d[d.length-1]||1,out=[];
  for(let k=0;k<n;k++){
    const tg=total*k/(n-1); let i=1; while(i<d.length-1&&d[i]<tg) i++;
    const seg=(d[i]-d[i-1])||1,r=(tg-d[i-1])/seg;
    out.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r]);
  }
  return out;
}

const LANGTAG={es:'es-ES',en:'en-US',de:'de-DE'};
const IS_ANDROID=/Android/i.test(navigator.userAgent);
let voices=[],speechReady=false,keepAlive=null,lang='de';
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
/* Voice quality is whatever the device has installed. Prefer, in order:
   the voice chosen in the parent panel; Apple "Premium"/"Enhanced" and
   Siri voices; Google/Microsoft neural or online voices. Never Apple's
   novelty voices (Albert, Bubbles, Zarvox…) or the eSpeak/Pico robots. */
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|deranged|hysterical|pipe organ|grandpa|grandma|rocko|shelley|reed|sandy|eddy|flo/;
function voiceScore(v){
  const n=((v.name||'')+' '+(v.voiceURI||'')).toLowerCase(),l=(v.lang||'').replace('_','-').toLowerCase();let s=0;
  if(/premium/.test(n))s+=14; if(/enhanced|erweitert|mejorad/.test(n))s+=10; if(/siri/.test(n))s+=9;
  if(/neural|natural|wavenet|online/.test(n))s+=8; if(/google/.test(n))s+=5; if(!v.localService)s+=4;
  if(l===LANGTAG[lang].toLowerCase())s+=3; if(/compact|espeak|pico/.test(n))s-=10; if(NOVELTY.test(n))s-=30;
  return s;
}
function langVoices(){
  if(!voices.length) loadVoices();
  return voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
}
function pickVoice(){
  const list=langVoices();let want='';try{want=localStorage.getItem('sl_voice_'+lang)||'';}catch(e){}
  return (want&&list.find(v=>v.voiceURI===want))||list[0]||null;
}
function utter(text,isRetry,rate){
  const synth=speechSynthesis;
  const u=new SpeechSynthesisUtterance(text);
  u.lang=LANGTAG[lang]; u.rate=rate||0.72; u.pitch=1.0; u.volume=1;
  const v=pickVoice(); if(v) u.voice=v;
  u.onstart=()=>{speechReady=true;hideWarn();clearInterval(keepAlive);
    keepAlive=setInterval(()=>{try{synth.resume();}catch(e){}},4000);};
  u.onend=()=>clearInterval(keepAlive);
  u.onerror=e=>{clearInterval(keepAlive); if(e&&e.error==='interrupted')return; showWarn();};
  try{synth.resume();synth.speak(u);}catch(e){showWarn();return;}
  if(!isRetry) setTimeout(()=>{
    if(!synth.speaking&&!synth.pending){loadVoices();
      const u2=new SpeechSynthesisUtterance(text);
      u2.lang=u.lang;u2.rate=rate||0.72;u2.pitch=1.0;u2.volume=1;
      u2.onstart=u.onstart;u2.onend=u.onend;u2.onerror=u.onerror;
      try{synth.resume();synth.speak(u2);}catch(e){}}
  },450);
}
let rewardOpen=false;                 // while the prize pop-up is up, nothing else talks over it
function sayAt(text,rate,force){
  if(rewardOpen&&!force) return;
  if(!('speechSynthesis' in window)){showWarn();return;}
  const synth=speechSynthesis;
  try{
    const busy=synth.speaking||synth.pending;
    if(busy) synth.cancel();
    if(busy||IS_ANDROID) setTimeout(()=>utter(text,false,rate),130); else utter(text,false,rate);
  }catch(e){showWarn();}
}
function say(text){ sayAt(text,0.72); }
function showWarn(msg){
  const w=document.getElementById('voiceWarn');
  w.textContent=msg||{

    en:'🔇 No voice. Settings → Languages → Text-to-speech → install voice data. Raise the media volume.',
    de:'🔇 Keine Stimme. Einstellungen → Sprachen → Sprachausgabe → Sprachdaten installieren. Medienlautstärke erhöhen.'}[lang];

let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();}catch(e){} return AC;}
function beep(f,when,dur=0.14,type='triangle',vol=0.22){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  const t=a.currentTime+when;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur=0.25,vol=0.16){
  const a=ac(); if(!a)return;
  const n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
  const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
  const g=a.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}

function fit(){

new ResizeObserver(fit).observe(cv);
const PAD=0.075;
const X=x=>S*(PAD+x/100*(1-2*PAD));
const Y=y=>S*(PAD+y/100*(1-2*PAD));
const tol=()=>S*0.115, startTol=()=>S*0.16;

function draw(){
  const now=performance.now(),beat=(now-t0)/1000;
  if(!S||!SHAPES[cur]){requestAnimationFrame(draw);return;}
  ctx.clearRect(0,0,S,S);
  ctx.save();ctx.translate(S/2,S/2);
  for(let i=0;i<28;i++){ctx.rotate(Math.PI*2/28);
    ctx.fillStyle=i%2?'rgba(27,42,91,.05)':'rgba(27,42,91,.02)';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(S,-S*0.05);ctx.lineTo(S,S*0.05);ctx.fill();}
  ctx.restore();

  ctx.save();ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.strokeStyle='#C3CEEA';
  [12,38].forEach(y=>{ctx.beginPath();ctx.moveTo(S*0.05,Y(y));ctx.lineTo(S*0.95,Y(y));ctx.stroke();});
  ctx.setLineDash([]);ctx.strokeStyle='#8FA3D0';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(S*0.05,Y(78));ctx.lineTo(S*0.95,Y(78));ctx.stroke();ctx.restore();

  const d=SHAPES[cur];

  d.pts.forEach(p=>{ctx.strokeStyle='#D6DDF0';ctx.lineWidth=S*0.14;poly(p,p.length-1);ctx.stroke();});
  for(let i=0;i<strokeIdx;i++) beam(d.pts[i],d.pts[i].length-1);

  if(strokeIdx<d.pts.length){
    const p=d.pts[strokeIdx];
    ctx.save();ctx.setLineDash([S*0.03,S*0.035]);ctx.lineDashOffset=-beat*S*0.09;
    ctx.strokeStyle='#1B2A5B';ctx.globalAlpha=.35;ctx.lineWidth=S*0.05;poly(p,p.length-1);ctx.stroke();ctx.restore();

    else if(cpIdx<p.length){
      const t=p[cpIdx];
      ctx.save();ctx.shadowColor='#00D4FF';ctx.shadowBlur=S*0.05;
      ctx.beginPath();ctx.arc(X(t[0]),Y(t[1]),S*0.028*(1+0.25*Math.sin(beat*9)),0,7);

function poly(p,upto){ctx.beginPath();ctx.moveTo(X(p[0][0]),Y(p[0][1]));
  for(let i=1;i<=upto;i++)ctx.lineTo(X(p[i][0]),Y(p[i][1]));}
function beam(p,upto){

  ctx.strokeStyle='#05060F';ctx.lineWidth=S*0.135;poly(p,upto);ctx.stroke();
  const g=ctx.createLinearGradient(X(p[0][0]),Y(p[0][1]),X(p[upto][0]),Y(p[upto][1]));
  g.addColorStop(0,'#00D4FF');g.addColorStop(.55,'#3B6BFF');g.addColorStop(1,'#FFD400');
  ctx.shadowColor='rgba(0,212,255,.9)';ctx.shadowBlur=S*0.045;
  ctx.strokeStyle=g;ctx.lineWidth=S*0.10;poly(p,upto);ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=S*0.022;poly(p,upto);ctx.stroke();

function bolt(cx,cy,r){
  const pts=[[0,-1],[-.42,.12],[-.05,.12],[-.3,1],[.45,-.15],[.06,-.15],[.28,-1]];
  ctx.save();ctx.translate(cx,cy);ctx.beginPath();
  pts.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p[0]*r,p[1]*r));ctx.closePath();
  ctx.shadowColor='rgba(255,212,0,.95)';ctx.shadowBlur=r*0.9;ctx.fillStyle='#FFD400';ctx.fill();

let conf=[];
function boom(n=110,ox=S/2,oy=S/2,spread=1){
  for(let i=0;i<n;i++) conf.push({x:ox,y:oy,
    vx:(Math.random()-.5)*S*0.024*spread,vy:(Math.random()-.95)*S*0.026*spread,

function drawConfetti(now){

  conf.forEach(p=>{

/* =============================================================

   A weighted up-down staircase (Kaernbach 1991): +1/3 of a level for
   a round solved on the first try, −1 level for a round with any
   miss. It settles where P(right)·⅓ = P(wrong)·1, i.e. where he gets
   about 3 in 4 right: hard enough that he makes mistakes, easy

}

/* =============================================================
   7. LISTENING — hear a word, choose the picture.

   The old version was broken in two ways and confused in a third:
   1. It fired three say() calls on timers, and say() cancels whatever
      is already speaking — so each word cut off the one before it and
      he heard fragments.
   2. Tapping a button to HEAR a word also committed it as his answer
      1.4s later, so exploring the options guaranteed a wrong answer.
   3. Numbered buttons made it a memory-and-matching puzzle rather than
      a listening one.
   Now: one word is spoken, four pictures are offered, no text is shown
   anywhere. Pure ear-to-meaning. Difficulty comes from how similar the
   wrong answers SOUND, which is a real listening skill and is the one
   thing the Palabras tab cannot teach.
============================================================= */
/* listening levels: number of pictures, and how alike they are —
   different category, same category, or words that SOUND alike */
const ELVL=[null,{n:3,m:'far'},{n:4,m:'far'},{n:4,m:'same'},{n:6,m:'same'},{n:4,m:'sound'},{n:6,m:'sound'}];

/* edit distance on the written word — a rough but effective stand-in
   for phonetic similarity (Hund/Hand, cat/hat, gato/pato). */
function editDist(a,b){
  a=a.toLowerCase();b=b.toLowerCase();
  const m=[];
  for(let i=0;i<=b.length;i++)m[i]=[i];
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  return m[b.length][a.length];
}
function soundScore(a,b){
  const d=editDist(a,b), L=Math.max(a.length,b.length);
  let sc=1-d/L;                                  // 1 = identical
  if(a[0]===b[0]) sc+=0.25;                      // same opening sound
  if(a.slice(-2)===b.slice(-2)) sc+=0.20;        // same ending
  if(Math.abs(a.length-b.length)<=1) sc+=0.10;   // same rough length
  return sc;
}
function earSay(rate){
  if(!earTarget) return;
  const sp=document.getElementById('earAgain');
  sp.classList.add('playing');
  setTimeout(()=>sp.classList.remove('playing'),1600);
  sayAt(earTarget[lang][1], rate||0.72);
}
function newEarRound(){

  let pool=VOCAB.filter(v=>!earRecent.includes(v.e));
  if(pool.length<10){earRecent=[];pool=VOCAB.slice();}
  earTarget=srsPick(pool);
  earRecent.push(earTarget.e); if(earRecent.length>14) earRecent.shift();
  const w=earTarget[lang][1],rest=VOCAB.filter(v=>v.e!==earTarget.e),k=cfg.n-1;
  let others;
  if(cfg.m==='far') others=shuffle(rest.filter(v=>v.c!==earTarget.c)).slice(0,k);
  else if(cfg.m==='same'){
    others=shuffle(rest.filter(v=>v.c===earTarget.c)).slice(0,k);
    if(others.length<k) others=others.concat(shuffle(rest.filter(v=>!others.includes(v))).slice(0,k-others.length));
  }else others=rest.map(v=>({v,s:soundScore(w,v[lang][1])})).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.v);
  const opts=shuffle([earTarget,...others]);

  g.style.gridTemplateColumns=opts.length===4?'repeat(2,1fr)':'repeat(3,1fr)';

function fitSky(){

const baseScale=()=>SS/18;                 // fits Neptune's orbit at zoom 1
const w2s=(wx,wy)=>{const k=baseScale()*zoom;
  return {x:SS/2+(wx-camX)*k, y:SS/2+(wy-camY)*k*0.82};};   // slight tilt
const worldR=r=>r*baseScale()*zoom;

const periodSecs=p=>Math.pow(p.per,0.6)*12;
function angleOf(p,i){ return p.per? clock*(2*Math.PI/periodSecs(p))+i*1.9 : 0; }

    if(p.x<0||p.x>SS||p.y<0||p.y>SS)return;

    sx.fillStyle='#fff';sx.beginPath();sx.arc(p.x,p.y,s.s,0,7);sx.fill();

/* ---- pan / pinch / tap ---- */
const ptrs=new Map();
let dragged=false,pinchStart=0,zoomStart=1,lastMid=null;

  e.preventDefault(); ac(); sky.setPointerCapture&&sky.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  dragged=false;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchStart=Math.hypot(a.x-b.x,a.y-b.y); zoomStart=zoom;
    lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }
});
sky.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; e.preventDefault();
  const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8) dragged=true;
  const k=baseScale()*zoom;
  if(ptrs.size===1){ camX-=dx/k; camY-=dy/(k*0.82); }
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchStart>0) setZoom(zoomStart*(d/pinchStart));
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(lastMid){const kk=baseScale()*zoom;
      camX-=(mid.x-lastMid.x)/kk; camY-=(mid.y-lastMid.y)/(kk*0.82);}
    lastMid=mid; dragged=true;
  }
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>sky.addEventListener(ev,e=>{
  const was=ptrs.size;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2){pinchStart=0;lastMid=null;}

/* ---- canvas drawings for the object adjective pairs ---- */
function drawAdj(cx2,W,H,key,yes,t){
  const g=cx2, cxp=W/2, cyp=H/2, U=Math.min(W,H);
  g.clearRect(0,0,W,H); g.lineJoin='round'; g.lineCap='round';
  const ink='#05060F';
  const disc=(x,y,r,col)=>{g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill();
    g.lineWidth=3;g.strokeStyle=ink;g.stroke();};
  switch(key){
    case 'big': disc(cxp,cyp,U*(yes?0.36:0.14),'#FF3B30'); break;
    case 'long':{
      const w=U*(yes?0.78:0.28),h=U*0.16;
      g.fillStyle='#25B7FF';g.strokeStyle=ink;g.lineWidth=3;
      g.beginPath();g.roundRect(cxp-w/2,cyp-h/2,w,h,h/2);g.fill();g.stroke();break;}
    case 'full':{
      const w=U*0.34,h=U*0.46,x=cxp-w/2,y=cyp-h/2;
      const lv=yes?0.86:0.08;
      g.fillStyle='#FF8A00';g.fillRect(x+4,y+h-h*lv,w-8,h*lv-3);
      g.strokeStyle=ink;g.lineWidth=4;g.strokeRect(x,y,w,h);break;}
    case 'open':{
      const w=U*0.5,h=U*0.3,x=cxp-w/2,y=cyp;
      g.fillStyle='#C68A52';g.strokeStyle=ink;g.lineWidth=4;
      g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);
      g.save();g.translate(x,y);
      if(yes)g.rotate(-0.9);
      g.fillStyle='#8B5E32';g.fillRect(0,-U*0.07,w,U*0.07);
      g.strokeRect(0,-U*0.07,w,U*0.07);g.restore();break;}
    case 'up':{
      const y=yes?cyp-U*0.18:cyp+U*0.18;
      disc(cxp,y,U*0.14,'#FFD400');
      g.strokeStyle=ink;g.lineWidth=5;
      g.beginPath();g.moveTo(cxp,cyp+(yes?U*0.05:-U*0.05));
      g.lineTo(cxp,y+(yes?U*0.14:-U*0.14));g.stroke();
      g.beginPath();g.moveTo(cxp-U*0.3,cyp+U*0.34);g.lineTo(cxp+U*0.3,cyp+U*0.34);g.stroke();break;}
    case 'happy':{
      disc(cxp,cyp,U*0.3,'#FFD400');
      g.fillStyle=ink;
      g.beginPath();g.arc(cxp-U*0.1,cyp-U*0.08,U*0.035,0,7);g.fill();
      g.beginPath();g.arc(cxp+U*0.1,cyp-U*0.08,U*0.035,0,7);g.fill();
      g.strokeStyle=ink;g.lineWidth=5;g.beginPath();
      if(yes)g.arc(cxp,cyp+U*0.04,U*0.14,0.25*Math.PI,0.75*Math.PI);
      else g.arc(cxp,cyp+U*0.22,U*0.14,1.25*Math.PI,1.75*Math.PI);
      g.stroke();break;}
    case 'dirty':{
      const w=U*0.44,h=U*0.44;
      g.fillStyle='#fff';g.strokeStyle=ink;g.lineWidth=4;
      g.beginPath();g.roundRect(cxp-w/2,cyp-h/2,w,h,10);g.fill();g.stroke();
      if(yes){g.fillStyle='#7A5230';
        [[-.12,-.1,.07],[.1,.05,.05],[-.04,.14,.06],[.13,-.13,.04]].forEach(([a,b,r])=>{
          g.beginPath();g.arc(cxp+a*U,cyp+b*U,r*U,0,7);g.fill();});}
      break;}
    case 'many':{
      const n=yes?12:3;
      for(let i=0;i<n;i++){
        const a=i*2.399,rr=U*0.06+ (i/n)*U*0.26;
        disc(cxp+Math.cos(a)*rr,cyp+Math.sin(a)*rr,U*0.05,'#2ED17A');}
      break;}
    case 'hot':{
      const w=U*0.3,h=U*0.34;
      g.fillStyle=yes?'#FF7043':'#7EC8E3';g.strokeStyle=ink;g.lineWidth=4;
      g.beginPath();g.roundRect(cxp-w/2,cyp-h/4,w,h,8);g.fill();g.stroke();
      g.strokeStyle=yes?'#FF3B30':'#25B7FF';g.lineWidth=5;
      for(let i=-1;i<=1;i++){
        g.beginPath();
        if(yes){g.moveTo(cxp+i*U*0.09,cyp-U*0.16);
          g.quadraticCurveTo(cxp+i*U*0.09+U*0.06,cyp-U*0.26,cxp+i*U*0.09,cyp-U*0.36);}
        else{g.moveTo(cxp+i*U*0.09-U*0.04,cyp-U*0.24);g.lineTo(cxp+i*U*0.09+U*0.04,cyp-U*0.24);
          g.moveTo(cxp+i*U*0.09,cyp-U*0.28);g.lineTo(cxp+i*U*0.09,cyp-U*0.2);}
        g.stroke();}
      break;}
    case 'fast':{
      const sp=yes?2.4:0.55;
      const x=cxp+Math.sin(t*sp)*U*0.26;
      g.strokeStyle='rgba(5,6,15,.28)';g.lineWidth=4;
      for(let i=1;i<=3;i++){g.beginPath();
        g.moveTo(x-U*0.14-i*U*0.07,cyp-U*0.06+i*U*0.06);
        g.lineTo(x-U*0.05-i*U*0.07,cyp-U*0.06+i*U*0.06);g.stroke();}
      disc(x,cyp,U*0.13,'#7A3FF2');break;}
    case 'loud':{
      const amp=yes?1:0.36;
      disc(cxp-U*0.12,cyp,U*0.1,'#FFD400');
      g.strokeStyle=ink;g.lineWidth=4;
      for(let i=1;i<=3;i++){
        const on=yes?true:i===1;
        if(!on)continue;
        g.globalAlpha=0.35+0.25*i*amp+0.2*Math.abs(Math.sin(t*4));
        g.beginPath();g.arc(cxp-U*0.05,cyp,U*(0.1+i*0.09*amp+0.05),-0.8,0.8);g.stroke();}
      g.globalAlpha=1;break;}
  }
}
function makeCard(drawFn){
  const wrap=document.createElement('div'); wrap.className='acard';
  const cn=document.createElement('canvas');
  wrap.appendChild(cn);
  requestAnimationFrame(()=>{
    const r=cn.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,3);
    cn.width=r.width*dpr; cn.height=r.height*dpr;
    const g=cn.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    const rec={g,w:r.width,h:r.height,draw:drawFn};
    actAnim.push(rec);
    drawFn(g,r.width,r.height,0);
  });
  return wrap;
}
function animLoop(){
  const t=performance.now()/1000;
  if(activeTab==='act')actAnim.forEach(a=>{try{a.draw(a.g,a.w,a.h,t);}catch(e){}});
  requestAnimationFrame(animLoop);
}

const INK='#05060F';
const DCOL={green:['#5BD06B','#3A9E4C','#E9F8B9','#FF8A3D'],red:['#FF6B5E','#C9443A','#FFE0C2','#FFD43B'],

            roar:{es:'¡GRRR!',en:'ROAR!',de:'RAAAH!'},shh:{es:'Chsss…',en:'Shh…',de:'Pssst…'}};
function txt(g,s,x,y,size,col,rot){g.save();g.translate(x,y);g.rotate(rot||0);g.font=`bold ${size}px Impact,"Arial Black",sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=size*0.28;g.strokeStyle=INK;g.strokeText(s,0,0);
  g.fillStyle=col||'#fff';g.fillText(s,0,0);g.restore();}
function note(g,x,y,s,col){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col||INK;g.strokeStyle=INK;g.lineWidth=1.4;
  g.beginPath();g.ellipse(0,0,2.6,2,-0.4,0,7);g.fill();g.beginPath();g.moveTo(2.3,-0.6);g.lineTo(2.3,-9);g.lineTo(6,-7);g.stroke();g.restore();}
function drop(g,x,y,s,col){g.fillStyle=col||'#5AB8FF';g.strokeStyle=INK;g.lineWidth=0.9;g.beginPath();g.moveTo(x,y-3*s);
  g.quadraticCurveTo(x+2.4*s,y+0.5*s,x,y+1.8*s);g.quadraticCurveTo(x-2.4*s,y+0.5*s,x,y-3*s);g.fill();g.stroke();}
function ball(g,x,y,r){g.fillStyle='#FF4F4F';g.strokeStyle=INK;g.lineWidth=1.4;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();
  g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.arc(x,y,r*0.6,0.3,2.2);g.stroke();}
function twinkle(g,x,y,s,a){g.save();g.translate(x,y);g.rotate(a||0);g.fillStyle='#FFF7AE';g.strokeStyle=INK;g.lineWidth=0.8;g.beginPath();
  for(let i=0;i<8;i++){const r=i%2?s*0.35:s,an=i*Math.PI/4;g.lineTo(Math.cos(an)*r,Math.sin(an)*r);}g.closePath();g.fill();g.stroke();g.restore();}
function limb(g,x,y,len,w,ang,col,foot){
  g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=col;g.strokeStyle=INK;g.lineWidth=2.2;
  g.beginPath();g.roundRect(-w/2,-w/2,w,len+w/2,w/2);g.fill();g.stroke();
  g.beginPath();if(foot)g.ellipse(w*0.35,len,w*0.78,w*0.42,0,0,7);else g.arc(0,len,w*0.62,0,7);g.fill();g.stroke();
  g.restore();
}

/* ---------- words and sentences ---------- */
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const deAdj=(stem,acc)=>stem+(stem.endsWith('e')?(acc?'n':''):(acc?'en':'e'));
const ADJ_ORDER={mood:0,size:1,age:2,wet:3,dirt:3,color:4,speed:5,loud:5};
const aW=a=>lang==='es'?a.es[0]:a[lang];
const vW=v=>lang==='de'?v.de[0]:v[lang];
function nounPhrase(adjs,acc,hl,cap){
  const html=!!hl;hl=hl||(x=>x);adjs=adjs.slice().sort((a,b)=>ADJ_ORDER[a.dim]-ADJ_ORDER[b.dim]);
  const C=w=>cap?capFirst(w):w,T=w=>html&&lang!=='en'?`<span class="art g-m">${C(w)}</span>`:C(w);
  if(lang==='de')return T(acc?'den':'der')+' '+adjs.map(a=>hl(deAdj(a.de,acc))+' ').join('')+'Dino';
  if(lang==='en')return C('the')+' '+adjs.map(a=>hl(a.en)+' ').join('')+'dino';
  const w=adjs.map(a=>hl(a.es[0]));
  return T('el')+' dino'+(w.length?' '+(w.length>1?w.slice(0,-1).join(', ')+' y '+w[w.length-1]:w[0]):'');
}
/* "Der kleine rote Dino springt!" — adjs attributive, verb conjugated */
function dSentence(adjs,v,hl){
  const np=nounPhrase(adjs,false,hl,true);hl=hl||(x=>x);
  if(!v)return '';
  if(lang==='de')return `${np} ${hl(v.de[0])}!`;
  if(lang==='en')return `${np} is ${hl(v.en)}!`;
  return `¡${np} está ${hl(v.es)}!`;
}
/* "Der Dino ist klein!" — predicative, no ending */
function dIs(a,hl){
  const html=!!hl;hl=hl||(x=>x);const T=w=>html?`<span class="art g-m">${w}</span>`:w;
  if(lang==='de')return `${T('Der')} Dino ist ${hl(a.de)}!`;
  if(lang==='en')return `The dino is ${hl(a.en)}!`;
  return `¡${T('El')} dino ${a.es[1]} ${hl(a.es[0])}!`;
}

    actTarget={kind,v,k};grid.classList.add('countMode');

      b.dataset.ok=i===k?'1':'0';b.onclick=()=>actChoose(i===k,b);row.appendChild(b);}
    grid.appendChild(row);actAsk();return;
  }else if(kind==='prep'){                   // "Welcher Dino ist unter dem Tisch?"
    const obj=Math.random()<0.5?'box':'table',ps=shuffle(POBJ[obj].preps).slice(0,L===3?3:4);
    actTarget={kind,obj,p:ps[0]};

    actAsk();return;
  }else if(kind==='neg'){                    // "Wer springt nicht?" — the odd one out
    const [v,o]=pickVerbs(2,DVERBS);actTarget={kind,v,o};
    opts=[stOf(o,[],0),stOf(v,[],1.3),stOf(v,[],2.6),stOf(v,[],3.9)];
  }else{                                     // a verb AND one or two adjectives must all match
    const dimsOk=['size','color','mood','wet','dirt','age'];
    const nd=kind==='combo3'?2:1,dims=shuffle(dimsOk).slice(0,nd);
    const pairs=dims.map(d=>d==='mood'?shuffle([DA('happy'),DA('sad')]):shuffle(DADJ.filter(a=>a.dim===d)).slice(0,2));
    const vs=pickVerbs(2,BODY_VERBS),tA=pairs.map(p=>p[0]);

    if(nd===1)opts=[[vs[0],[pairs[0][0]]],[vs[0],[pairs[0][1]]],[vs[1],[pairs[0][0]]],[vs[1],[pairs[0][1]]]];
    else opts=[[vs[0],tA],[vs[1],tA],[vs[0],[pairs[0][1],tA[1]]],[vs[0],[tA[0],pairs[1][1]]]];
    opts=opts.map(([v,a],i)=>stOf(v,a,i*1.3));

  const order=shuffle(opts.map((o,i)=>i));
  grid.classList.toggle('three',order.length===3);
  order.forEach(i=>{
    const card=makeCard((g,w,h,t)=>drawDino(g,w,h,opts[i],t));

function actQuestion(){
  const T=actTarget;

  if(T.kind==='verb'){const v=T.v;return lang==='de'?`Wer ${v.de[0]}?`:lang==='en'?`Who is ${v.en}?`:`¿Quién está ${v.es}?`;}
  if(T.kind==='adj'){const a=T.a;return lang==='de'?`Welcher Dino ist ${a.de}?`:lang==='en'?`Which dino is ${a.en}?`:`¿Qué dino ${a.es[1]} ${a.es[0]}?`;}
  if(T.kind==='prep'){const P=PREPS[T.p][lang],O=POBJ[T.obj][lang];
    return lang==='de'?`Welcher Dino ist ${P} ${O}?`:lang==='en'?`Which dino is ${P} ${O}?`:`¿Qué dino está ${P} ${O}?`;}
  if(T.kind==='neg'){const v=T.v;return lang==='de'?`Wer ${v.dn||v.de[0]+' nicht'}?`:lang==='en'?`Who is not ${v.en}?`:`¿Quién no está ${v.es}?`;}
  if(T.kind==='count'){const v=T.v;return lang==='de'?`Wie viele Dinos ${v.dp}?`:lang==='en'?`How many dinos are ${v.enp||v.en}?`:`¿Cuántos dinos están ${v.ep||v.es}?`;}
  if(T.kind==='obj'){const w=T.word,many=T.def.plural;
    if(many)return lang==='es'?`¿Dónde hay ${w}?`:lang==='de'?`Wo sind ${w}?`:`Which one has ${w}?`;
    const cop=['long'].includes(T.def.k)?'es':'está';
    return lang==='es'?`¿Cuál ${cop} ${w}?`:lang==='de'?`Welches ist ${w}?`:`Which one is ${w}?`;}
  const v=T.v,np=nounPhrase(T.adjs,true);
  return lang==='de'?`Finde ${np}, der ${v.de[1]}!`:lang==='en'?`Find ${np} that is ${v.en}!`:`¡Busca ${np} que está ${v.es}!`;

function actAnswerHTML(){

    if(lang==='de')return `${A('Der')} Dino ist ${hl(P+' '+O)}!`;
    if(lang==='en')return `The dino is ${hl(P)} ${O}!`;
    return `¡${A('El')} dino está ${hl(P)} ${O}!`;}
  if(T.kind==='neg'){const v=T.v,o=T.o;
    if(lang==='de')return `Er ${hl(v.dn||v.de[0]+' nicht')} – er ${hl(o.de[0])}!`;

    return `¡${hl('No está '+v.es)}, está ${hl(o.es)}!`;}
  if(T.kind==='count'){const v=T.v,k=T.k,N={de:['','Ein','Zwei','Drei','Vier','Fünf'],en:['','One','Two','Three','Four','Five'],es:['','Un','Dos','Tres','Cuatro','Cinco']}[lang][k];

/* =============================================================
   PRIZES — what the ⚡ points buy.
   40 ⚡ (about 40 correct answers, ~8 minutes of real play) buys
   ONE prize game of his choice. Points are SPENT, so the counter
   means something, and they are saved so a reload loses nothing.
   The prize games have no fail state: difficulty belongs in
   earning the prize, not in enjoying it.
============================================================= */
const DIG_COST=40;                       // price of any prize game

/* ---------- the ⚡ counter ---------- */
function savePower(){try{localStorage.setItem('sl_power',String(power));}catch(e){}}
let lastTap={x:innerWidth/2,y:innerHeight/2};
document.addEventListener('pointerdown',e=>{lastTap={x:e.clientX,y:e.clientY};},true);
function renderPower(bump){
  const el=$('power'), ready=power>=DIG_COST;
  el.textContent=(ready?'🎁 ':'⚡ ')+power;
  el.style.setProperty('--pct',(ready?100:power/DIG_COST*100).toFixed(1)+'%');
  el.classList.toggle('ready',ready);
  if(bump){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  document.querySelectorAll('.tab[data-id="dig"]').forEach(b=>b.classList.toggle('ready',ready));
}
$('power').addEventListener('animationend',e=>{if(e.animationName==='bump')$('power').classList.remove('bump');});
$('power').onclick=()=>{ac();if(power>=DIG_COST)showTab('dig');};
/* a "+1 ⚡" flies from his finger to the counter, so he SEES where points go */
function flyBolt(n,label){
  const pill=$('power').getBoundingClientRect();
  const f=document.createElement('div');f.className='flyBolt';f.textContent=label||('+'+n+'⚡');
  f.style.left=lastTap.x+'px';f.style.top=lastTap.y+'px';
  document.body.appendChild(f);
  if(!f.animate){setTimeout(()=>f.remove(),50);return;}
  const dx=pill.left+pill.width/2-lastTap.x, dy=pill.top+pill.height/2-lastTap.y;
  f.animate([
    {transform:'translate(-50%,-50%) scale(.5)',opacity:0},
    {transform:`translate(calc(-50% + ${dx*.12}px),calc(-50% + ${dy*.12-55}px)) scale(1.6)`,opacity:1,offset:.3},
    {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.55)`,opacity:.85}
  ],{duration:820,easing:'cubic-bezier(.45,0,.7,1)'}).onfinish=()=>f.remove();
}
function addPower(n=1){
  const before=power; power+=n; savePower();
  flyBolt(n);
  setTimeout(()=>{renderPower(true);beep(1320,0,0.08,'triangle',0.12);},800);
  // crossing a multiple of 40 = a new prize: wait for the win overlay to finish first
  if(Math.floor(before/DIG_COST)<Math.floor(power/DIG_COST)) setTimeout(showReward,2800);
  if(activeTab==='dig'&&pane==='digLock') showDigLock();
}
/* Points must not reward guessing: a right answer on the first try is
   worth 1 ⚡, on the second try still 1, after that nothing (the round
   still ends happily). Five first-try answers in a row earn a 🔥 bonus. */
let fireStreak=0;
function award(misses,base){
  base=base||1;
  if(misses>=2){fireStreak=0;return 0;}
  if(misses===0){fireStreak++;}else fireStreak=0;
  addPower(base);
  if(fireStreak&&fireStreak%5===0)setTimeout(()=>{flyBolt(2,'🔥+2');addPowerQuiet(2);
    [880,1175,1568].forEach((f,i)=>beep(f,i*0.07,0.18,'triangle',0.18));},950);
  return base;
}
function addPowerQuiet(n){const before=power;power+=n;savePower();setTimeout(()=>renderPower(true),800);
  if(Math.floor(before/DIG_COST)<Math.floor(power/DIG_COST))setTimeout(showReward,2800);}

/* ---------- extra sound effects ---------- */
function sweep(f0,f1,dur,type,vol,when){
  const a=ac(); if(!a)return; const t=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
}

  [[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,t])=>beep(f,t,0.22,'square',0.15));
  [523,659,784,1047].forEach(f=>beep(f,.82,0.9,'triangle',0.13));

/* a synthesised roar: two detuned saws, growling LFO, closing filter */
function roar(big){
  const a=ac(); if(!a)return; const t=a.currentTime;
  const f0=big?150:520, f1=big?62:240;
  const o=a.createOscillator(),o2=a.createOscillator(),lfo=a.createOscillator();
  o.type='sawtooth';o2.type='square';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+1.1);
  o2.frequency.setValueAtTime(f0*1.03,t);o2.frequency.exponentialRampToValueAtTime(f1*1.03,t+1.1);
  lfo.frequency.value=big?26:38;const lg=a.createGain();lg.gain.value=big?35:90;
  lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  const lp=a.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(big?1100:3200,t);lp.frequency.exponentialRampToValueAtTime(big?260:700,t+1.25);
  const gn=a.createGain();gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.32,t+0.08);gn.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
  o.connect(lp);o2.connect(lp);lp.connect(gn);gn.connect(a.destination);
  [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+1.35);});
  noise(big?0.9:0.4,0.1);
}

    case 't':{const dx=p.b[0]-p.a[0],dy=p.b[1]-p.a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*p.w/2,ny=dx/L*p.w/2;

    case 'p':g.beginPath();p.pts.forEach((q,i)=>g[i?'lineTo':'moveTo'](q[0],q[1]));g.closePath();

function makeCover(n){

    const ph=rnd(0,6),amp=n*rnd(0.006,0.02),fr=rnd(5,9);

  for(let k=0;k<1800;k++){g.fillStyle=Math.random()<0.5?'rgba(0,0,0,.13)':'rgba(255,240,200,.12)';
    const s=n*rnd(0.002,0.006);g.fillRect(Math.random()*n,Math.random()*n,s,s);}
  for(let k=0;k<45;k++){const x=Math.random()*n,y2=n*rnd(0.08,1),rx=n*rnd(0.008,0.022),ry=rx*rnd(0.6,0.9);
    g.fillStyle=pick(['#8d8173','#a39482','#6f655a','#b5a58c']);g.beginPath();g.ellipse(x,y2,rx,ry,rnd(0,3),0,7);g.fill();
    g.strokeStyle='rgba(40,30,15,.45)';g.lineWidth=Math.max(1,n*0.002);g.stroke();
    g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(x-rx*0.3,y2-ry*0.35,rx*0.35,ry*0.25,0,0,7);g.fill();}
  g.strokeStyle='rgba(50,30,10,.35)';g.lineWidth=Math.max(1,n*0.002);
  for(let k=0;k<10;k++){let x=Math.random()*n,y2=n*rnd(0.06,0.35);g.beginPath();g.moveTo(x,y2);
    for(let s=0;s<5;s++){x+=n*rnd(-0.02,0.02);y2+=n*rnd(0.01,0.03);g.lineTo(x,y2);}g.stroke();}
  g.fillStyle='#4CAF50';g.beginPath();g.moveTo(0,0);g.lineTo(n,0);       // grass on top

  g.strokeStyle='#2E8B3A';g.lineWidth=Math.max(1.5,n*0.004);
  for(let k=0;k<90;k++){const x=Math.random()*n;g.beginPath();g.moveTo(x,n*0.05);g.lineTo(x+n*rnd(-0.01,0.01),n*rnd(0.005,0.035));g.stroke();}

function makeBed(n){

    g.beginPath();for(let a=0;a<6*Math.PI;a+=0.2){const r=s*a/(6*Math.PI);g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.stroke();

function drawStar(g,x,y,r,c,rot){

/* layout helpers: a part's transform L = {x,y (fraction of site), r (rad), sx,sy (scale)} */
function ptAt(pt,q,L){L=L||pt.L;const ux=(q[0]-pt.c[0])*L.sx,uy=(q[1]-pt.c[1])*L.sy,c=Math.cos(L.r),s=Math.sin(L.r);
  return [L.x+ux*c-uy*s,L.y+ux*s+uy*c];}
const inBox=(p,m)=>p[0]>m&&p[0]<1-m&&p[1]>m&&p[1]<1-m;
const allIn=pt=>pt.smp.every(q=>inBox(ptAt(pt,q),0.03));
function scatterOne(pt,K,at){
  const f=Math.random()<0.5?1:-1;
  for(let t=0;t<14;t++){
    const p=at&&t<4?at:[rnd(0.15,0.85),rnd(0.15,0.85)];
    pt.L={x:p[0],y:p[1],r:rnd(0,Math.PI*2),sx:f*K,sy:K};
    if(allIn(pt))return;
    if(t>5)K*=0.88;
  }
}
function layoutDig(parts,box,home){
  const kind=pick(['art','scatter','mixed']),f=Math.random()<0.5?1:-1;
  if(kind==='scatter'){
    const n=parts.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),cells=shuffle([...Array(cols*rows).keys()]);
    parts.forEach((pt,i)=>{const ci=cells[i];
      scatterOne(pt,home.K*0.72,[(ci%cols+0.5+rnd(-0.3,0.3))/cols,(Math.floor(ci/cols)+0.5+rnd(-0.3,0.3))/rows]);});
    return kind;
  }
  const bcx=(box[0]+box[2])/2,bcy=(box[1]+box[3])/2;
  let K=home.K*(kind==='art'?0.95:0.82),th=rnd(-0.35,0.35);
  for(let tries=0;tries<8;tries++){
    const cx=0.5+rnd(-0.06,0.06),cy=0.5+rnd(-0.06,0.06),c=Math.cos(th),s=Math.sin(th);
    parts.forEach(pt=>{const vx=f*(pt.c[0]-bcx)*K,vy=(pt.c[1]-bcy)*K;pt.L={x:cx+vx*c-vy*s,y:cy+vx*s+vy*c,r:th,sx:f*K,sy:K};});
    if(parts.every(allIn))break;
    K*=0.9;th*=0.7;
  }
  if(kind==='mixed'){                // a flood washed a few bones away
    shuffle(parts.filter(p=>['head','jaw','leg','tail','arm','wing','neck'].includes(p.k)))
      .slice(0,2+Math.floor(Math.random()*2)).forEach(pt=>scatterOne(pt,K*0.95));
  }
  return kind;
}

}

function digStroke(p){

    for(let i=1;i<=n;i++)pts.push([digLast[0]+(p[0]-digLast[0])*i/n,digLast[1]+(p[1]-digLast[1])*i/n]);}
  else pts.push(p);

function stamp(p){
  const D=DIG,n=D.cov.width,g=D.covG,x=p[0]*n,y=p[1]*n,R=BR*n*1.15;
  g.save();g.globalCompositeOperation='destination-out';
  const gr=g.createRadialGradient(x,y,0,x,y,R);
  gr.addColorStop(0,'rgba(0,0,0,.11)');gr.addColorStop(.55,'rgba(0,0,0,.07)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill();g.restore();
  const cw=1/GRID,i0=Math.max(0,Math.floor((p[0]-BR)/cw)),i1=Math.min(GRID-1,Math.floor((p[0]+BR)/cw)),
        j0=Math.max(0,Math.floor((p[1]-BR)/cw)),j1=Math.min(GRID-1,Math.floor((p[1]+BR)/cw));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const d=Math.hypot((i+0.5)*cw-p[0],(j+0.5)*cw-p[1]);if(d>BR)continue;
    const k=j*GRID+i;if(D.grid[k]<=0)continue;
    D.grid[k]-=12*(1-d/BR)+2.5;if(D.grid[k]<=0){D.grid[k]=0;D.open++;}
  }
  if(Math.random()<0.5)D.fx.push({k:'dust',x:p[0]+rnd(-0.02,0.02),y:p[1]+rnd(-0.02,0.02),vx:rnd(-0.004,0.004),vy:rnd(-0.008,-0.002),
    t:performance.now(),c:pick(['#8A5A2E','#B07D46','#6E4422','#C9A06A'])});
}
const isOpen=p=>{const i=Math.floor(p[0]*GRID),j=Math.floor(p[1]*GRID);

function sparkle(x,y,n,col){const now=performance.now();

function checkFinds(){
  const D=DIG,now=performance.now();let newly=null;

    let o=0;pt.smp.forEach(q=>{if(isOpen(ptAt(pt,q)))o++;});
    if(o/pt.smp.length>=0.5){pt.found=true;pt.foundAt=now;newly=pt;sparkle(pt.L.x,pt.L.y,16,'#FFD400');}});
  D.tre.forEach(t=>{if(t.found)return;let o=0;
    [[0,0],[0.02,0],[-0.02,0],[0,0.02],[0,-0.02]].forEach(d=>{if(isOpen([t.x+d[0],t.y+d[1]]))o++;});
    if(o>=3){t.found=true;t.at=now;sparkle(t.x,t.y,22,'#7DF9FF');
      beep(1568,0,0.12,'triangle',0.18);beep(2093,0.1,0.25,'triangle',0.18);say(t.t[lang]);

const easeOut=t=>1-Math.pow(1-clamp01(t),3);
const easeBack=t=>{t=clamp01(t);const c=1.4,u=t-1;return 1+(c+1)*u*u*u+c*u*u;};
function aliveXf(D,now,W){
  const t=(now-D.aliveT)/1000,H=D.home,rt=t-D.roarT;
  const jaw=rt>=0&&rt<1.4?Math.sin(Math.PI*rt/1.4)*0.32:0;
  const ang={head:0.06*Math.sin(t*2.2)+jaw*0.35,neck:0.035*Math.sin(t*2.2-0.6),neck2:0.035*Math.sin(t*2.2-1.2),jaw:-jaw,
    tail:0.06*Math.sin(t*2.6),tail2:0.1*Math.sin(t*2.6-0.9),legA:0.16*Math.sin(t*4.2),legC:-0.16*Math.sin(t*4.2),
    arm:0.18*Math.sin(t*4.2+1),wing:0.28*Math.sin(t*5)};
  const bob=-Math.abs(Math.sin(t*4.2))*0.012,map={};D.parts.forEach(p=>map[p.n]=p);
  return (g,pt)=>{
    g.translate(H.ox*W,(H.oy+bob)*W);g.scale(H.K*W,H.K*W);
    const ch=[];let q=pt;while(q){ch.unshift(q);q=q.par?map[q.par]:null;}
    ch.forEach(c=>{const a=ang[c.an]||0;if(a){g.translate(c.pv[0],c.pv[1]);g.rotate(a);g.translate(-c.pv[0],-c.pv[1]);}});
    return H.K*W;
  };
}
function digLoop(now){
  if(!DIG||pane!=='digPlay'||activeTab!=='dig')return;
  const D=DIG,W=DS;
  // phase transitions + assembly motion
  if(D.phase==='reveal'&&now-D.revealT>700){D.phase='assemble';D.asmT=now;D.parts.forEach(pt=>{pt.S=Object.assign({},pt.L);pt.arr=false;});}
  if(D.phase==='assemble'){
    let all=true;
    D.parts.forEach((pt,i)=>{
      const t=clamp01((now-D.asmT-i*70)/900);
      if(t<1)all=false;else if(!pt.arr){pt.arr=true;beep(260+i*30,0,0.06,'square',0.08);}
      const S=pt.S,H=pt.H,e=easeBack(t),e2=easeOut(t);
      const dr=((H.r-S.r+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
      pt.L={x:S.x+(H.x-S.x)*e,y:S.y+(H.y-S.y)*e-Math.sin(Math.PI*t)*0.07,r:S.r+dr*e2,sx:S.sx+(H.sx-S.sx)*e2,sy:S.sy+(H.sy-S.sy)*e2};
    });
    if(all)goAlive();
  }
  dx.clearRect(0,0,W,W);
  dx.drawImage(D.bed,0,0,W,W);
  D.tre.forEach(t=>{const pop=t.found?Math.max(0,1-(now-t.at)/600):0;
    drawTreasure(dx,t.t.k,t.x*W,t.y*W,W*0.04*(1+pop*0.5),t.rot);});
  D.parts.forEach(pt=>{pt.glow=pt.foundAt&&now-pt.foundAt<1400?22*(1-(now-pt.foundAt)/1400)+4:0;});
  const xf=D.phase==='alive'?aliveXf(D,now,W):(g,pt)=>{const L=pt.L;
    g.translate(L.x*W,L.y*W);g.rotate(L.r);g.scale(L.sx*W,L.sy*W);g.translate(-pt.c[0],-pt.c[1]);return Math.abs(L.sy*W);};
  drawBones(dx,D.parts,xf);
  const ca=D.phase==='dig'?1:D.phase==='reveal'?1-(now-D.revealT)/700:0;
  if(ca>0){dx.globalAlpha=Math.max(0,ca);dx.drawImage(D.cov,0,0,W,W);dx.globalAlpha=1;}
  if(D.phase==='dig'){
    dx.save();dx.strokeStyle='rgba(255,255,255,.3)';dx.lineWidth=1;dx.setLineDash([5,5]);   // the site's string grid
    for(let i=1;i<4;i++){dx.beginPath();dx.moveTo(i*W/4,0);dx.lineTo(i*W/4,W);dx.moveTo(0,i*W/4);dx.lineTo(W,i*W/4);dx.stroke();}
    dx.restore();
    if(now-D.lastFound>8000){                 // stuck? a star twinkles over a hidden bone
      if(!D.hint||D.hint.found)D.hint=pick(D.parts.filter(p=>!p.found));
      if(D.hint){dx.save();dx.globalAlpha=0.55+0.45*Math.sin(now/180);
        drawStar(dx,D.hint.L.x*W,D.hint.L.y*W,W*0.05*(0.7+0.3*Math.sin(now/180)),'#FFF7AE',now/600);dx.restore();}
    }
  }
  D.fx=D.fx.filter(f=>now-f.t<(f.k==='dust'?600:1000));
  D.fx.forEach(f=>{const life=(now-f.t)/(f.k==='dust'?600:1000);f.x+=f.vx;f.y+=f.vy;dx.globalAlpha=Math.max(0,1-life);
    if(f.k==='dust'){f.vy+=0.0006;dx.fillStyle=f.c;dx.beginPath();dx.arc(f.x*W,f.y*W,W*0.006,0,7);dx.fill();}
    else{f.vx*=0.94;f.vy*=0.94;drawStar(dx,f.x*W,f.y*W,W*0.018*(1-life*0.5),f.c,now/200);}});
  dx.globalAlpha=1;
  requestAnimationFrame(digLoop);
}

function startFw(){

function fwText(){$('fwPrompt').textContent=FW.done?'🏆 '+{es:'¡Qué bonito!',en:'So pretty!',de:'Wie schön!'}[lang]:'🎆 '+Math.max(0,FW.goal-FW.shots);}
function launch(x,y,W,H){
  FW.rk.push({x0:x+rnd(-0.08,0.08)*W,y0:H,x,y:Math.min(y,H*0.68),t:0,dur:rnd(0.55,0.8),

function explode(r){
  const n=r.kind==='heart'?64:84;boomFx();
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let vx,vy;
    if(r.kind==='heart'){vx=16*Math.pow(Math.sin(a),3)*9;vy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*9;}
    else if(r.kind==='ring'){vx=Math.cos(a)*150;vy=Math.sin(a)*150;}
    else{const s=rnd(40,190);vx=Math.cos(a+rnd(-0.1,0.1))*s;vy=Math.sin(a+rnd(-0.1,0.1))*s;}

    FW.sp.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:vx*r.k,vy:vy*r.k,c:r.kind==='double'&&i%2?r.c[1]:r.c[0],t:0,

}
function fwLoop(now){

const mapC=document.getElementById('map'),mx=mapC.getContext('2d');
let MW=400,MH=230,selectedGeo=0,geoQuizOn=false,geoTarget=-1;
const lon2x=l=>(l+180)/360*MW;
/* Equal-area (Lambert cylindrical) rather than the usual equirectangular.
   On a plain lat/lon grid Antarctica draws at 34% of the world's land and
   Africa at 11%; the truth is 9% and 20%. With y=sin(lat) every continent
   lands within ~2% of its real share, so the first world map he ever sees
   is not the one that makes Africa look small. */
/* The stretch wasn't only the projection — it was the canvas shape. A
   cylindrical map has a natural width:height, and forcing it into a
   differently-proportioned box squashes every continent. Equal-area in a
   1.35 box stretched Africa to h/w 2.28 when the truth is 1.45.
   Now: plain lat/lon, cropped to 80S-84N (the polar caps are empty and
   they are where this projection distorts worst), drawn at 1.6:1 — which
   reproduces Africa at h/w 1.44. Shapes he can recognise come first. */
const LAT_HI=84, LAT_LO=-80;
const lat2y=l=>{
  const c=Math.max(LAT_LO,Math.min(LAT_HI,l));
  return (LAT_HI-c)/(LAT_HI-LAT_LO)*MH;
};
function fitMap(){
  const r=mapC.getBoundingClientRect(); if(!r.width) return;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  MW=r.width; MH=r.width/1.6;
  mapC.width=MW*dpr; mapC.height=MH*dpr;
  mx.setTransform(dpr,0,0,dpr,0,0);
  drawMap();
}
new ResizeObserver(fitMap).observe(mapC);
function lighten(hex){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)+55),g=Math.min(255,((n>>8)&255)+55),b=Math.min(255,(n&255)+55);
  return `rgb(${r},${g},${b})`;
}
function contPath(c){
  mx.beginPath();
  c.rings.forEach(ring=>{
    ring.forEach((p,i)=>{const x=lon2x(p[0]),y=lat2y(p[1]);i?mx.lineTo(x,y):mx.moveTo(x,y);});
    mx.closePath();
  });
}
function drawMap(){
  if(!MW) return;
  mx.clearRect(0,0,MW,MH);
  mx.fillStyle='#123A63';mx.fillRect(0,0,MW,MH);
  mx.strokeStyle='rgba(255,255,255,.10)';mx.lineWidth=1;      // equator + grid
  [-60,-30,0,30,60].forEach(l=>{mx.beginPath();mx.moveTo(0,lat2y(l));mx.lineTo(MW,lat2y(l));mx.stroke();});
  [-120,-60,0,60,120].forEach(l=>{mx.beginPath();mx.moveTo(lon2x(l),0);mx.lineTo(lon2x(l),MH);mx.stroke();});
  CONTINENTS.forEach((c,i)=>{
    const sel=(i===selectedGeo&&!geoQuizOn);
    contPath(c);
    mx.fillStyle=sel?lighten(c.col):c.col; mx.fill();
    // a thick highlight stroke on a 4000-point coastline drowns the fill,
    // so selection is shown by brightening + a thin ring, not a fat outline
    mx.lineWidth=sel?2.2:1.4;
    mx.strokeStyle=sel?'#FFD400':'rgba(5,6,15,.85)';
    mx.stroke();
  });
  CONTINENTS.forEach((c,i)=>{                                  // labels
    const cx=lon2x(c.at[0]), cy=lat2y(c.at[1]);
    const name=c[lang][0].replace(/^(la|the|die)\s+/i,'');
    mx.font='700 '+Math.max(8,Math.min(13,MW*0.026))+'px Trebuchet MS, sans-serif';
    mx.textAlign='center';mx.textBaseline='middle';
    mx.lineWidth=3;mx.strokeStyle='rgba(5,6,15,.55)';
    mx.strokeText(name,cx,cy);
    mx.fillStyle=i===selectedGeo&&!geoQuizOn?'#FFD400':'#fff';
    mx.fillText(name,cx,cy);
  });
}
/* Point-in-polygon done here rather than with ctx.isPointInPath: that API
   requires the browser to transform the tap point by the canvas matrix, and
   some Android WebViews don't, which made every inland tap miss. */
function pointInRings(px,py,rings){
  let inside=false;
  for(const ring of rings){
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=lon2x(ring[i][0]),yi=lat2y(ring[i][1]);
      const xj=lon2x(ring[j][0]),yj=lat2y(ring[j][1]);
      if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
    }
  }
  return inside;
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
  let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));
}
function hitContinent(px,py){
  // Europe is tested before Asia, so the genuinely shared ground
  // (Turkey, western Russia) resolves to Europe rather than at random
  const order=[1,0,2,3,4,5,6];
  for(const i of order){
    if(pointInRings(px,py,CONTINENTS[i].rings)) return i;
  }
  // nothing hit exactly — fall back to the nearest outline, so small
  // fingers on Europe or Oceania still land somewhere sensible
  // Simplified coastlines put some coastal points a pixel or two offshore,
  // and small fingers miss small shapes — so fall back to the nearest outline
  // within a generous radius rather than ignoring the tap.
  let best=-1,bd=1e9;
  CONTINENTS.forEach((c,i)=>{
    c.rings.forEach(r=>{
      for(let k=0,m=r.length-1;k<r.length;m=k++){
        const d=segDist(px,py,lon2x(r[m][0]),lat2y(r[m][1]),lon2x(r[k][0]),lat2y(r[k][1]));
        if(d<bd){bd=d;best=i;}
      }
    });
  });
  return bd<MW*0.09?best:-1;
}
mapC.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();
  const r=mapC.getBoundingClientRect();
  const i=hitContinent(e.clientX-r.left,e.clientY-r.top);
  if(i<0) return;
  if(geoQuizOn) geoAnswer(i); else geoSelect(i,true);
});

function backupData(){const d={app:'noahs-exploration-game',v:1,saved:new Date().toISOString(),data:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('sl_'))d.data[k]=localStorage.getItem(k);}}catch(e){}
  return d;}
$('backupSave').onclick=async()=>{
  const d=backupData(),name='noah-backup-'+d.saved.slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify(d)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});
      $('backupMsg').textContent='✅';return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);$('backupMsg').textContent='✅ '+name;
};
$('backupLoad').onclick=()=>$('backupFile').click();
$('backupFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='noahs-exploration-game'||!d.data)throw 0;
      if(!confirm({es:'¿Reemplazar el progreso actual con esta copia?',en:'Replace the current progress with this backup?',de:'Aktuellen Fortschritt durch diese Sicherung ersetzen?'}[lang]))return;
      Object.keys(localStorage).filter(k=>k.startsWith('sl_')).forEach(k=>localStorage.removeItem(k));
      Object.entries(d.data).forEach(([k,v])=>{if(k.startsWith('sl_'))localStorage.setItem(k,v);});
      location.reload();
    }catch(err){$('backupMsg').textContent={es:'❌ Ese archivo no es una copia válida',en:'❌ That file is not a valid backup',de:'❌ Das ist keine gültige Sicherung'}[lang];}};
  r.readAsText(f);e.target.value='';
};

(function(){
  const g=document.getElementById('gearBtn');
  // a parent HOLDS it for one second (the ring fills); a quick tap from a child just shows "hold"
  let timer=null,raf=null,t0=0;
  const fill=()=>{const p=Math.min(100,(performance.now()-t0)/10);g.style.setProperty('--hold',p+'%');if(p<100)raf=requestAnimationFrame(fill);};
  const start=()=>{t0=performance.now();fill();timer=setTimeout(()=>{stop();ac();showTab('parent');},1000);};
  const stop=()=>{clearTimeout(timer);cancelAnimationFrame(raf);
    if(performance.now()-t0<900&&activeTab!=='parent'){const tip=$('gearTip');
      tip.textContent={es:'⚙ Mantén pulsado (padres)',en:'⚙ Press and hold (parents)',de:'⚙ Gedrückt halten (Eltern)'}[lang];
      tip.classList.add('on');clearTimeout(tip._t);tip._t=setTimeout(()=>tip.classList.remove('on'),1600);}
    g.style.setProperty('--hold','0%');};
  g.addEventListener('pointerdown',e=>{e.preventDefault();start();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,()=>{if(timer)stop();timer=null;}));
})();
