<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1030">
<meta name="apple-mobile-web-app-title" content="Little Explorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>The Little Explorer</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <button id="homeBtn" aria-label="Home">🏠</button>
  <div class="power display" id="power">⚡ 0</div>
  <button id="gearBtn" aria-label="settings">⚙</button>
  <div class="lang">
    <button id="es">🇪🇸</button><button id="en">🇬🇧</button><button id="de" class="on">🇩🇪</button>
  </div>
</header>

<div id="advBar"></div>

<!-- ============ HOME: one big card per section ============ -->
<div class="view" id="v-home">
  <div id="homeHello" class="display"></div>
  <div id="homeGrid"></div>
</div>

<!-- ============ ADVENTURE MAP ============ -->
<div class="view" id="v-adv">
  <div id="advTitle" class="display"></div>
  <div id="advMap"></div>
  <button class="btn" id="advGo"></button>
  <button class="btn" id="advAgain"></button>
</div>

<!-- ============ TRACE ============ -->
<div class="view on" id="v-trace">
  <div class="segs" id="segs"></div>
  <div id="stage"><div id="wrap">
    <canvas id="c"></canvas>
    <div id="praise"><div id="praiseCol">
      <div id="burst"><div id="face">💥</div></div>
      <div id="wordText" class="display"></div>
    </div></div>
  </div></div>
  <div id="voiceWarn"></div>
  <div class="letterbar" id="letterbar"></div>
  <div class="tools">
    <button id="sayBtn">🔊</button><button id="againBtn">↺</button><button id="nextBtn">➜</button>
  </div>
</div>

<!-- ============ WORDS QUIZ ============ -->
<div class="view" id="v-words">
  <div id="quizHead"><div id="levelPill" class="display">🎯 3</div></div>
  <div class="chips" id="catChips"></div>
  <div class="prompt display" id="quizPrompt">…</div>
  <div id="grid"></div>
  <div class="tools"><button id="repeatBtn">🔊</button><button id="skipBtn">➜</button></div>
</div>

<!-- ============ LISTENING ============ -->
<div class="view" id="v-ear">
  <div id="earHead"><div id="earLevelPill" class="display">🎧 1</div>
    <button id="earAgain">🔊</button><button id="earSkip">➜</button></div>
  <div id="earLetter" class="display"></div>
  <div id="earGrid"></div>
</div>

<!-- ============ DINO SHOW: verbs & adjectives ============ -->
<div class="view" id="v-act">
  <div id="actHead"><div class="segs" id="actModes"></div><div id="actLevel" class="display">🎯 1</div></div>
  <div id="actQuiz" class="apane on">
    <div class="prompt display" id="actPrompt">…</div>
    <div id="actGrid"></div>
    <div id="tprBox"><div id="tprStage"></div><button class="btn" id="tprDone">✅</button></div>
    <div id="actSentence"></div>
  </div>
  <div id="actPlay" class="apane">
    <canvas id="playCv"></canvas>
    <div id="playSentence"></div>
    <div id="playAdj"></div>
    <div id="playVerbs"></div>
  </div>
  <div id="actParrot" class="apane">
    <canvas id="parrotCv"></canvas>
    <div id="parrotText"></div>
    <div id="parrotMsg"></div>
    <div class="parrotBtns"><button id="parrotHear">🔊</button><button id="parrotRec">🎤</button><button id="parrotNext">➜</button></div>
  </div>
  <div id="actStory" class="apane">
    <div id="storyDots"></div>
    <canvas id="storyCv"></canvas>
    <div id="storyText"></div>
    <div id="storyQ" class="prompt display"></div>
    <div id="storyGrid"></div>
    <div class="parrotBtns"><button id="storyHear">🔊</button><button id="storyNext">▶</button></div>
  </div>
  <div class="tools" id="actTools"><button id="actAgain">🔊</button><button id="actSkip">➜</button></div>
</div>

<!-- ============ WORLD MAP ============ -->
<div class="view" id="v-geo">
  <div id="geoHead"><div class="segs" id="geoModes"></div><div id="geoLevel" class="display">🎯 1</div></div>
  <div id="geoQ" class="prompt display"></div>
  <div id="mapWrap"><canvas id="map"></canvas>
    <div id="mapBtns"><button id="geoZin">➕</button><button id="geoZout">➖</button><button id="geoHome">🌍</button></div></div>
  <div id="geoFlags"></div>
  <div id="geoBox"><div id="geoName" class="display">🌍</div><div id="geoText">…</div></div>
  <div class="tools"><button id="geoSay">🔊</button></div>
</div>

<!-- ============ PRIZES ============ -->
<div class="view" id="v-dig">
  <div id="digLock" class="pane on">
    <div id="lockIcon">🎁</div>
    <div id="lockText" class="display">…</div>
    <div id="meterOuter"><div id="meterFill"></div></div>
    <div id="meterLabel"></div>
    <div id="gameGrid"></div>
    <div id="museumTitle" class="display"></div>
    <div id="museum"></div>
    <div id="treasures"></div>
  </div>
  <div id="digPlay" class="pane">
    <div id="digTop"><div class="prompt display" id="digPrompt">…</div><div id="boneCount"></div></div>
    <canvas id="dig"></canvas>
    <div id="dinoCard"><div id="dinoName" class="display"></div><div id="dinoFact"></div></div>
    <div class="tools"><button id="digQuit">🏠</button></div>
  </div>
  <div id="memPlay" class="pane">
    <div class="prompt display" id="memPrompt">…</div>
    <div id="memGrid"></div>
    <div class="tools"><button class="quitBtn">🏠</button></div>
  </div>
  <div id="balPlay" class="pane">
    <div class="prompt display" id="balPrompt">…</div>
    <canvas id="bal" class="gameCv"></canvas>
    <div class="tools"><button class="quitBtn">🏠</button></div>
  </div>
  <div id="fwPlay" class="pane">
    <div class="prompt display" id="fwPrompt">…</div>
    <canvas id="fw" class="gameCv"></canvas>
    <div class="tools"><button class="quitBtn">🏠</button></div>
  </div>
</div>

<!-- ============ SPACE ============ -->
<div class="view" id="v-space">
  <div id="spaceWrap"><canvas id="sky"></canvas></div>
  <div id="factBox"><div id="factName" class="display">🪐</div><div id="factText">…</div></div>
  <div class="tools">
    <button id="zoomOut">➖</button><button id="zoomIn">➕</button><button id="zoomReset">⤢</button>
    <button id="pauseBtn">⏸</button><button id="spaceQuizBtn">🎯</button><button id="spaceSayBtn">🔊</button>
  </div>
</div>

<!-- ============ PARENT ============ -->
<!-- ============ CITY ============ -->
<div class="view" id="v-city">
  <div id="cityBar">
    <button id="cFind" aria-label="Find">🔎</button><button id="cNight" aria-label="Night">🌙</button><button id="cHome" aria-label="Whole town">🧭</button>
    <span class="sp"></span><span id="cPaws">🐾 0/14</span>
  </div>
  <div id="cityWrap">
    <canvas id="cityCv"></canvas>
    <div id="cityQ"></div>
    <div id="cityBub"></div>
    <div id="cityZoom"><button id="cZin" aria-label="Zoom in">+</button><button id="cZout" aria-label="Zoom out">−</button></div>
  </div>
</div>

<div class="view" id="v-parent"><div id="parent">
  <div class="panel">
    <h3 id="pReportTitle">📊</h3>
    <div id="repBars"></div>
    <div id="repWords"></div>
  </div>
  <div class="panel">
    <h3 id="pNameTitle">Name for the tracing tab</h3>
    <input id="nameInput" value="" maxlength="12" placeholder="MAX">
    <button class="btn" id="saveName">OK</button>
  </div>
  <div class="panel">
    <h3 id="pPowerTitle">⚡</h3>
    <div class="row"><span id="pPowerVal">0</span>
      <span><button class="btn" id="pPlus">+10 ⚡</button> <button class="btn" id="pZero">0</button></span></div>
  </div>
  <div class="panel">
    <h3 id="pLimitTitle">⏰</h3>
    <div id="limitBtns" class="segs" style="padding:0;flex-wrap:wrap"></div>
    <div id="limitInfo" style="font-size:13px;margin-top:6px"></div>
  </div>
  <div class="panel">
    <h3 id="pAdvTitle">🗺️</h3>
    <div id="advSizes" class="segs" style="padding:0"></div>
  </div>
  <div class="panel">
    <h3 id="pVoiceTitle">🔊</h3>
    <select id="voiceSel"></select>
    <button class="btn" id="voiceTest">▶</button>
    <div id="voiceTip" style="font-size:13px;margin-top:8px;line-height:1.35"></div>
  </div>
  <div class="panel">
    <h3 id="pLevelTitle">Levels</h3>
    <div id="levelRows"></div>
    <button class="btn" id="resetLevels">↺</button>
  </div>
  <div class="panel">
    <h3 id="pMissTitle">Most-missed words</h3>
    <div id="missRows"><div class="row"><span>—</span><span>0</span></div></div>
    <button class="btn" id="resetStats">Reset</button>
  </div>
  <div class="panel">
    <h3 id="pBackupTitle">💾</h3>
    <div id="pBackupText" style="font-size:13px;line-height:1.35"></div>
    <button class="btn" id="backupSave">💾 ⬇</button>
    <button class="btn" id="backupLoad">📂 ⬆</button>
    <input type="file" id="backupFile" accept="application/json,.json" style="display:none">
    <div id="backupMsg" style="font-size:13px;font-weight:bold;margin-top:6px"></div>
  </div>
  <button class="btn" id="backBtn">← Volver</button>
</div></div>

<div id="quizWin"><div id="quizFace">⭐</div><div id="quizWord" class="display"></div></div>

<div id="reward">
  <div id="rwRays"></div><div id="rwConf"></div>
  <div id="rwChest">🎁</div>
  <div id="rwTitle" class="display"></div>
  <div id="rwSub"></div>
  <button class="btn" id="rwGo"></button>
  <button class="btn" id="rwLater"></button>
</div>
<div id="rain"></div>

<div id="gearTip"></div>
<div id="sleep"><canvas id="sleepCv"></canvas><div id="sleepTitle" class="display"></div><div id="sleepSub"></div>
  <button id="sleepMore"></button></div>
<canvas id="mascot" aria-label="Rexi"></canvas>

<div id="gate"><div>
  <div class="gateBolt">⚡</div>
  <div class="gateText display" id="gateText">Tippe zum Starten!</div>
  <div class="gateSub" id="gateSub">Activa el sonido y la voz</div>
</div></div>

<script src="js/core.js"></script>
<script src="js/shapes.js"></script>
<script src="js/vocab.js"></script>
<script src="js/audio.js"></script>
<script src="js/trace.js"></script>
<script src="js/learn.js"></script>
<script src="js/space.js"></script>
<script src="js/dinoshow.js"></script>
<script src="js/prizes.js"></script>
<script src="js/world-data.js"></script>
<script src="js/world.js"></script>
<script src="js/city-wild.js"></script>
<script src="js/city-far.js"></script>
<script src="js/city-west.js"></script>
<script src="js/city-industry.js"></script>
<script src="js/city.js"></script>
<script src="js/app.js"></script>
</body>
</html>
