<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2C63C9">
<title>Little Explorer City</title>
<style>
  @font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
  @font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
  :root{--ink:#1D2350;--bolt:#FFC928;--lift:0 4px 0 rgba(10,14,55,.30)}
  html,body{margin:0;height:100%;overflow:hidden;background:#93D46F;color:var(--ink);font-family:Nunito,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;display:flex;flex-direction:column}
  #bar{display:flex;align-items:center;gap:7px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;
    background:linear-gradient(#3B7DE2,#2C63C9);box-shadow:0 4px 14px rgba(0,0,40,.25);z-index:3}
  #bar button{border:none;background:#fff;border-radius:14px;height:44px;min-width:44px;padding:0 6px;font-size:22px;cursor:pointer;
    box-shadow:var(--lift);color:var(--ink);font-family:inherit}
  #bar button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(10,14,55,.3)}
  #bar button.on{background:var(--bolt)}
  #paws{font:800 16px 'Baloo 2',system-ui;color:#fff;white-space:nowrap;padding:0 2px}
  .sp{flex:1}
  #langs{display:flex;gap:2px;background:rgba(255,255,255,.22);border-radius:14px;padding:3px}
  #langs button{height:38px;min-width:36px;font-size:19px;background:transparent;box-shadow:none;padding:0 3px}
  #langs button.on{background:#fff;box-shadow:0 2px 0 rgba(10,14,55,.25)}
  #wrap{position:relative;flex:1;min-height:0;overflow:hidden}
  #city{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #q{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:center;gap:8px;z-index:2;
    background:#fff;border-radius:22px;padding:6px 16px;font:800 22px 'Baloo 2',system-ui;white-space:nowrap;cursor:pointer;
    box-shadow:0 5px 0 rgba(10,14,55,.22),0 10px 24px rgba(0,0,0,.18)}
  #q.on{display:flex}
  #q .st{font-size:16px;background:var(--bolt);border-radius:999px;padding:0 9px}
  #bubble{position:absolute;left:0;top:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .25s;
    background:#fff;border-radius:18px;padding:5px 14px;font:800 20px 'Baloo 2',system-ui;white-space:nowrap;
    box-shadow:0 4px 0 rgba(10,14,55,.2),0 8px 18px rgba(0,0,0,.18);transform:translate(-50%,-100%)}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  #bubble.on{opacity:1}
  #zoom{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:2}
  #zoom button{width:46px;height:46px;border:none;border-radius:14px;background:#fff;font:800 26px 'Baloo 2',system-ui;color:var(--ink);
    box-shadow:var(--lift);cursor:pointer}
  #zoom button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(10,14,55,.3)}
  #voiceWarn{display:none;position:absolute;left:10px;right:66px;bottom:12px;background:#fff;border-radius:14px;padding:10px;font-size:14px;z-index:4}
</style>
</head>
<body>
<div id="bar">
  <button id="bHome" aria-label="Home">🏠</button>
  <button id="bFind" aria-label="Find">🔎</button>
  <button id="bNight" aria-label="Night">🌙</button>
  <span id="paws">🐾 0</span>
  <span class="sp"></span>
  <span id="langs"><button data-l="es">🇪🇸</button><button data-l="en">🇬🇧</button><button data-l="de" class="on">🇩🇪</button></span>
</div>
<div id="wrap">
  <canvas id="city"></canvas>
  <div id="q"></div>
  <div id="bubble"></div>
  <div id="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button></div>
  <div id="voiceWarn"></div>
</div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/city.js"></script>
</body>
</html>
